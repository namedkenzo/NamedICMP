name: Build Linux archives
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash scripts/test_installer.sh
      - run: bash scripts/test_update.sh
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: namedicmp-linux-builds
          path: dist/*
          retention-days: 30
      - name: Create draft prerelease with installer assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version_dir=$(mktemp -d)
          tar -xzf dist/namedicmp-linux-amd64.tar.gz -C "$version_dir" namedicmp
          test "$RELEASE_TAG" = "v$("$version_dir/namedicmp" version)"
          rm -rf "$version_dir"
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --title "namedICMP $RELEASE_TAG" --notes-file docs/RELEASE-v0.2.2-alpha.md
