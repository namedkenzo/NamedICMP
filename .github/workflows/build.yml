name: Build Linux archives
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash scripts/test_installer.sh
      - run: bash scripts/test_update.sh
      - run: python3 scripts/test_network_tuning.py
      - run: node scripts/test_versions.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:ui
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: namedicmp-linux-builds
          path: dist/*
          retention-days: 30
      - name: Publish server release with installer assets
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-server]'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version_dir=$(mktemp -d)
          tar -xzf dist/namedicmp-linux-amd64.tar.gz -C "$version_dir" namedicmp
          server_tag="v$("$version_dir/namedicmp" version)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$RELEASE_TAG" = "$server_tag"
          fi
          rm -rf "$version_dir"
          release_flags=(--latest)
          if [[ "$server_tag" == *-* ]]; then
            release_flags=(--prerelease)
          fi
          gh release create "$server_tag" dist/* --target "$GITHUB_SHA" "${release_flags[@]}" --title "namedICMP $server_tag · Web panel" --notes-file "docs/RELEASE-${server_tag}.md"

