name: Build Linux archives
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go test -race ./...
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: namedicmp-linux-builds
          path: dist/*
          retention-days: 30
