name: Verify namedICMP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go mod verify
      - name: Check stability Go formatting
        run: |
          files=(internal/core/{core,session,writer,dual_transport,receive,receive_test,download_load_test,drain_test,capacity,capacity_test,admission_stale_test}.go internal/reliable/{reliable,reliable_test}.go)
          gofmt -d "${files[@]}"
          test -z "$(gofmt -l "${files[@]}")"
      - run: go test -race ./...
      - name: Repeat paced lossy download regression
        run: go test ./internal/core -run 'TestDownloadOnlyParallelFlows|TestDispatchTimerStarts' -count=3 -v
      - name: Verify admission regression fails on v0.5.1
        run: |
          git fetch --depth=1 origin cc78881478028570cee350e4b19a346c5e11c132
          baseline_dir=$(mktemp -d /tmp/namedicmp-admission-baseline.XXXXXX)
          git archive cc78881478028570cee350e4b19a346c5e11c132 | tar -x -C "$baseline_dir"
          cp internal/core/admission_stale_test.go "$baseline_dir/internal/core/admission_stale_test.go"
          set +e
          (cd "$baseline_dir" && go test ./internal/core -run '^TestSaturatedAdmissionIgnoresLateTCP$' -count=1 -v) >"$baseline_dir/result.log" 2>&1
          baseline_result=$?
          set -e
          cat "$baseline_dir/result.log"
          test "$baseline_result" -ne 0
          grep -q 'stale TCP was charged as capacity pressure' "$baseline_dir/result.log"
      - name: Compare the same download harness against v0.5.0
        run: |
          git fetch --depth=1 origin f9553eb6ec81db99a697489641ee0510131936eb
          baseline_dir=$(mktemp -d /tmp/namedicmp-baseline.XXXXXX)
          git archive f9553eb6ec81db99a697489641ee0510131936eb | tar -x -C "$baseline_dir"
          cp internal/core/download_load_test.go "$baseline_dir/internal/core/download_load_test.go"
          set +e
          (cd "$baseline_dir" && go test ./internal/core -run '^TestDownloadOnlyParallelFlowsSurvivePacingAndLoss$' -count=1 -v)
          baseline_result=$?
          echo "Baseline v0.5.0 regression exit=$baseline_result (comparison only, not the new-code test gate)."
      - run: go vet ./...
      - name: Exercise real ICMPv4 and ICMPv6 echo filters on loopback
        run: |
          go test -c -o /tmp/namedicmp-panel.test ./internal/panel
          sudo /tmp/namedicmp-panel.test -test.run '^TestEchoLoopback$' -test.v
      - name: Check Go formatting
        run: |
          files=(internal/panel/{panel,stats,monitor,live,probe,health,monitor_test}.go internal/core/{core,session,integration_test}.go)
          gofmt -d "${files[@]}"
          test -z "$(gofmt -l "${files[@]}")"
      - run: bash scripts/test_installer.sh
      - run: bash scripts/test_update.sh
      - run: python3 scripts/test_uninstall.py
      - run: python3 scripts/test_detect_addresses.py
      - run: bash scripts/test_service_network.sh
      - run: bash scripts/test_uninstall_systemd.sh
      - run: python3 scripts/test_network_tuning.py
      - run: python3 scripts/test_capacity_trial.py
      - run: node --check internal/panel/web/app.js
      - run: node --check internal/panel/web/dashboard.js
      - run: node scripts/test_versions.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:ui
      - run: node scripts/dashboard_visual.cjs
        env:
          DASHBOARD_PREVIEW_LOG: ${{ github.ref == 'refs/heads/live-dashboard' && '1' || '0' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dashboard-previews
          path: /tmp/namedicmp-dashboard-previews/*.jpg
          if-no-files-found: ignore
          retention-days: 7
      - run: go test ./internal/wire -fuzz=FuzzDecode -fuzztime=15s -parallel=2
      - run: go test ./internal/wire -fuzz=FuzzEncryptedDecoder -fuzztime=15s -parallel=2
      - run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -o /tmp/namedicmp ./cmd/namedicmp

