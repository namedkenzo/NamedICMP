name: Verify namedICMP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash scripts/test_installer.sh
      - run: bash scripts/test_update.sh
      - run: python3 scripts/test_network_tuning.py
      - run: node --check internal/panel/web/app.js
      - run: node scripts/test_versions.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:ui
      - run: go test ./internal/wire -fuzz=FuzzDecode -fuzztime=15s -parallel=2
      - run: go test ./internal/wire -fuzz=FuzzEncryptedDecoder -fuzztime=15s -parallel=2
      - run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -o /tmp/namedicmp ./cmd/namedicmp

